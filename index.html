-width:90vw;color:var(--carta);background:var(--ombra);z-index:6;pointer-events:none;border-radius:6px;padding:8px 14px;font-size:14px;display:none;position:fixed;top:54px;left:50%;transform:translate(-50%)}#segnalazioni{width:min(520px,100vw - 20px);color:var(--carta);box-sizing:border-box;z-index:10;-webkit-user-select:text;user-select:text;touch-action:auto;background:#1c140ceb;border-radius:8px;padding:10px;display:none;position:fixed;top:52px;bottom:10px;right:10px;overflow-y:auto}#segnalazioni .testa{flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:10px;display:flex}#segnalazioni .testa b{margin-right:auto;font-size:16px}#segnalazioni .voce{border-top:1px solid #f3ead833;gap:8px;padding:8px 0;display:flex}#segnalazioni img{border-radius:4px;flex:none;width:200px;height:auto}#segnalazioni .dati{flex:1;min-width:0;font:12px/1.5 Consolas,monospace}#segnalazioni textarea{box-sizing:border-box;width:100%;min-height:44px;margin:4px 0;font:13px Georgia,serif}#segnalazioni .dati button{margin-right:4px;padding:4px 9px;font-size:13px}@media (width<=560px){#segnalazioni img{width:120px}}</style>
